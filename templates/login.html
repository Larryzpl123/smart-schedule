{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<h1>Log in</h1>
<form method="post">
  <label>School email</label>
  <input name="email" type="email" placeholder="27doej@{{ domain }}" required>
  <label>Password</label>
  <input name="password" type="password" required>
  <button type="submit">Log in</button>
</form>
<div class="links">
  <a href="{{ url_for('register') }}">Sign up</a> ·
  <a href="{{ url_for('forgot') }}">Forgot password?</a> ·
  <a href="{{ url_for('admin_login') }}">Admin</a>
</div>
<div class="links" style="margin-top:.6rem">
  Not sure yet? <a href="{{ url_for('sample') }}">See a sample schedule</a>
  <span style="color:var(--ink-dim)">(no account needed)</span>
</div>
<div class="links" style="margin-top:.6rem">
  Don't want an account at all?
  <a href="{{ url_for('local_intro') }}">Use local mode</a>
  <span style="color:var(--ink-dim)">(kept in this browser, never sent to us)</span>
</div>
{% endblock %}
